<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Anya's Journey</title>
    <meta name="description" content="Anya's Journey Foundation: accessible, inclusive playgrounds for all ages." />
    <meta name="theme-color" content="#ffffff" />
    <!-- Installable: "Add to Home Screen" opens full screen, like a native app -->
    <link rel="manifest" href="/anyasjourney/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Anya's Journey" />
    <link rel="apple-touch-icon" href="/anyasjourney/icons/icon-180.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #ffffff;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Feel like an app, not a web page */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
      input,
      textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      [role="button"],
      [role="link"],
      [role="tab"],
      a {
        cursor: default !important;
      }

      /* Desktop: show the app inside a phone */
      .stage-text {
        display: none;
      }
      @media (min-width: 640px) and (min-height: 600px) {
        body {
          background: radial-gradient(circle at 30% 20%, #f3eee6 0%, #e7dccb 55%, #d8c7ad 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 64px;
        }
        #root {
          flex: none;
          width: 390px;
          height: min(844px, calc(100vh - 48px));
          border-radius: 48px;
          overflow: hidden;
          background: #ffffff;
          border: 12px solid #1d1d1f;
          box-shadow: 0 30px 80px rgba(60, 45, 20, 0.35), 0 0 0 2px #3a3a3c;
          position: relative;
          transform: translateZ(0); /* keeps fixed-position children inside the phone */
        }
        .stage-text {
          display: block;
          max-width: 300px;
          font-family: Georgia, 'Times New Roman', serif;
          color: #292929;
        }
        .stage-text h1 {
          font-size: 40px;
          margin: 0 0 12px;
          line-height: 1.1;
        }
        .stage-text p {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 16px;
          line-height: 1.6;
          color: #5f5f5f;
          margin: 0 0 12px;
        }
        .stage-text .badge {
          display: inline-block;
          background: #b8a07e;
          color: #fff;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 12px;
          letter-spacing: 2px;
          padding: 6px 12px;
          border-radius: 999px;
          margin-bottom: 16px;
        }
      }
      @media (min-width: 640px) and (max-width: 899px) {
        .stage-text {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="stage-text">
      <span class="badge">APP PREVIEW</span>
      <h1>Anya's Journey</h1>
      <p>This is a preview of the iPhone and Android app.</p>
      <p>On your phone, open this page and choose "Add to Home Screen" to try it full screen.</p>
    </div>
    <div id="root"></div>
  </body>
</html>
